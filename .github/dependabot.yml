version: 2
updates:
  - package-ecosystem: npm # also covers pnpm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Majors that frameworks pin: upgrade these by hand once Next.js/Vite support them.
      # @types/node tracks the Node LTS used in CI, not the newest Node.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: nuget
    directory: /apps/api
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
